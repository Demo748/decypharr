name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0). Leave empty to use the latest stable git tag in the repo.'
        required: false
        default: ''
        type: string
      create_release:
        description: 'Create a GitHub release (otherwise binaries are only available as workflow artifacts)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

env:
  REGISTRY_GHCR: ghcr.io/demo748/decypharr
  LDFLAGS_PKG: github.com/demo748/decypharr/pkg/version

jobs:
  # Determine release channel from tag
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - name: Extract version and channel
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "Resolution path: tag-push (TAG=${TAG})"
          else
            TAG="${INPUT_VERSION}"
            if [ -n "$TAG" ]; then
              echo "Resolution path: workflow_dispatch with explicit input (TAG=${TAG})"
            else
              echo "Resolution path: workflow_dispatch with empty input — querying GitHub API"
              ALL_TAGS="$(gh api "repos/${{ github.repository }}/tags" --paginate --jq '.[].name')"
              echo "API returned $(printf '%s\n' "$ALL_TAGS" | grep -c . || true) tag(s); first 5:"
              printf '%s\n' "$ALL_TAGS" | head -n 5 | sed 's/^/  /'
              TAG="$(printf '%s\n' "$ALL_TAGS" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V -r | head -n 1)"
              if [ -z "$TAG" ]; then
                echo "No stable semver tag matched; falling back to v0.0.0-dev"
                TAG="v0.0.0-dev"
              else
                echo "Resolved TAG=${TAG}"
              fi
            fi
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *"-beta"* ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *"-rc"* ]]; then
            echo "channel=rc" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *"-dev"* ]]; then
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

  # Build Linux binaries (CGO required for FUSE + rapidyenc)
  build-linux:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        include:
          - arch: amd64
            cc: gcc
            cxx: g++
          - arch: arm64
            cc: zig cc -target aarch64-linux-gnu
            cxx: zig c++ -target aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install Zig
        if: matrix.arch == 'arm64'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install libfuse-dev
        run: sudo apt-get update && sudo apt-get install -y libfuse-dev

      - name: Build
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X ${LDFLAGS_PKG}.Version=${VERSION} -X ${LDFLAGS_PKG}.Channel=${CHANNEL}" \
            -o dist/decypharr

      - name: Package
        run: |
          ARCH="${{ matrix.arch }}"
          [ "$ARCH" = "amd64" ] && ARCH="x86_64"
          tar czf "dist/decypharr_Linux_${ARCH}.tar.gz" -C dist decypharr

      - name: Upload artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: linux-${{ matrix.arch }}
          path: dist/decypharr_Linux_*.tar.gz

  # Build Windows binary (no CGO — cgofuse uses syscall.LoadLibrary for WinFsp)
  build-windows:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X ${LDFLAGS_PKG}.Version=${VERSION} -X ${LDFLAGS_PKG}.Channel=${CHANNEL}" \
            -o dist/decypharr.exe

      - name: Package
        working-directory: dist
        run: zip decypharr_Windows_x86_64.zip decypharr.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: windows-amd64
          path: dist/decypharr_Windows_x86_64.zip

  # Build macOS binaries (CGO required, needs macFUSE headers)
  build-darwin:
    runs-on: macos-latest
    needs: prepare
    strategy:
      matrix:
        include:
          - arch: amd64
            label: x86_64
          - arch: arm64
            label: arm64
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install macFUSE headers
        run: brew install macfuse

      - name: Build
        env:
          CGO_ENABLED: 1
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X ${LDFLAGS_PKG}.Version=${VERSION} -X ${LDFLAGS_PKG}.Channel=${CHANNEL}" \
            -o dist/decypharr

      - name: Package
        run: tar czf "dist/decypharr_Darwin_${{ matrix.label }}.tar.gz" -C dist decypharr

      - name: Upload artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: darwin-${{ matrix.arch }}
          path: dist/decypharr_Darwin_*.tar.gz

  # Build and push multi-platform Docker images
  docker:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            CHANNEL=${{ needs.prepare.outputs.channel }}
          tags: |
            ${{ env.REGISTRY_GHCR }}:${{ needs.prepare.outputs.tag }}
            ${{ needs.prepare.outputs.channel != 'dev' && format('{0}:latest', env.REGISTRY_GHCR) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Create GitHub release with all binaries
  release:
    runs-on: ubuntu-latest
    needs: [prepare, build-linux, build-windows, build-darwin]
    if: github.event_name == 'push' || inputs.create_release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download binary artifacts
        uses: actions/download-artifact@v4.1.8
        with:
          pattern: '{linux,windows,darwin}-*'
          path: artifacts

      - name: Stage release assets
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} dist/ \;
          echo "Staged release assets:"
          ls -la dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          PRERELEASE=""
          if [ "$CHANNEL" != "stable" ]; then
            PRERELEASE="--prerelease"
          fi
          TARGET_FLAG=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TARGET_FLAG="--target ${TARGET_SHA}"
          fi

          gh release create "$TAG" dist/* \
            --title "decypharr ${TAG}" \
            --generate-notes \
            $PRERELEASE \
            $TARGET_FLAG \
            --notes-start-tag "$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")"
